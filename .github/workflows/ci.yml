name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Motion validator import smoke check
        run: pnpm test:motion-validator-import

      - name: Build motion protocol
        run: pnpm --filter @lvk/motion-protocol build

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: MediaPipe expression mapping tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_expression_mapping.py

      - name: MediaPipe blendshape category adapter tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_blendshape_category_adapter.py

      - name: MediaPipe face result selection tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_face_result_selection.py

      - name: MediaPipe facial transform matrix adapter tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_facial_transform_matrix_adapter.py

      - name: MediaPipe matrix normalization tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_matrix_mapping.py

      - name: MediaPipe rotation mapping tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_rotation_mapping.py

      - name: MediaPipe face candidate observation tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_face_candidate_observation.py

      - name: MediaPipe helper tracking payload tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_helper_tracking_payload.py

      - name: MediaPipe helper result JSON tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_helper_result_json.py

      - name: MediaPipe helper frame input tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_helper_frame_input.py

      - name: MediaPipe helper RGB frame tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_helper_frame_rgb.py

      - name: MediaPipe Face Landmarker options tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_face_landmarker_options.py

      - name: MediaPipe Face Landmarker runtime tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_face_landmarker_runtime.py

      - name: MediaPipe Face Landmarker inference tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_face_landmarker_inference.py

      - name: MediaPipe Face Landmarker result composition tests
        run: python -B native/tracker-core/helpers/mediapipe_face_landmarker/test_face_landmarker_result_composition.py
