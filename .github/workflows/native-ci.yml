name: Native CI
on: [push, pull_request]
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/tracker-core -B native/tracker-core/build
      - run: cmake --build native/tracker-core/build
      - run: node tools/check-native-runtime-capabilities.mjs native/tracker-core/build/lvk-tracker-core
      - run: node tools/check-native-tracker-output.mjs native/tracker-core/build/lvk-tracker-core
      - run: node tools/check-native-tracker-stdout-flush.mjs native/tracker-core/build/lvk-tracker-core native/tracker-core/build/lvk-synthetic-helper
      - run: node tools/check-native-backend-parity-motionframe.mjs native/tracker-core/build/lvk-tracker-core
      - run: node tools/check-helper-message-parse.mjs native/tracker-core/build/lvk-helper-message-parse-smoke
      - run: node tools/check-helper-frame-packet.mjs native/tracker-core/build/lvk-helper-frame-packet-smoke
      - run: node tools/check-helper-result-mapping.mjs native/tracker-core/build/lvk-helper-result-mapping-smoke
      - run: node tools/check-helper-process-supervision.mjs native/tracker-core/build/lvk-helper-process-supervision-smoke native/tracker-core/build/lvk-synthetic-helper
      - run: node tools/check-helper-runtime-integration.mjs native/tracker-core/build/lvk-tracker-core native/tracker-core/build/lvk-synthetic-helper
      - run: node tools/check-helper-runtime-fallback.mjs native/tracker-core/build/lvk-tracker-core native/tracker-core/build/lvk-synthetic-helper
      - run: node tools/check-native-landmark-helper-session.mjs native/tracker-core/build/lvk-tracker-core native/tracker-core/build/lvk-synthetic-helper
      - run: node tools/check-native-frame-helper-backend-boundary.mjs
      - run: native/tracker-core/build/lvk-tracking-backend-terminal-failure-smoke native/tracker-core/build/lvk-synthetic-helper
      - run: node tools/check-native-landmark-frame-transport.mjs native/tracker-core/build/lvk-tracker-core native/tracker-core/build/lvk-synthetic-helper native/tracker-core/build/lvk-helper-frame-transport-smoke
      - run: node tools/check-native-mediapipe-helper-route-config.mjs native/tracker-core/build/lvk-mediapipe-helper-route-config-smoke
      - run: node tools/check-native-mediapipe-helper-frame-bridge.mjs native/tracker-core/build/lvk-mediapipe-helper-frame-bridge-smoke python3
      - run: node tools/check-native-mediapipe-helper-route.mjs native/tracker-core/build/lvk-tracker-core
      # v0.13.0 (#589): bounded helper result-timeout recovery smoke. The
      # OpenCV-linked recovery smoke drives the real FrameHelperTrackingBackend
      # owner path, which is only compiled with OpenCV enabled. The baseline
      # build above intentionally configures WITHOUT OpenCV and must stay that
      # way, so this runs as a separate, final stage: install the Linux OpenCV
      # dev dependency, configure a fresh OpenCV-enabled build directory, build
      # only the new recovery smoke target, and run it. This confines the added
      # dependency to this stage and changes no existing runtime-capability
      # expectation or #587 smoke contract.
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: cmake -S native/tracker-core -B native/tracker-core/build-recovery-opencv
      - run: cmake --build native/tracker-core/build-recovery-opencv --target lvk-tracking-backend-result-timeout-recovery-smoke
      - run: native/tracker-core/build-recovery-opencv/lvk-tracking-backend-result-timeout-recovery-smoke
